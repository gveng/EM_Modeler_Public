<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Drawing plane background -->
  <rect x="8" y="20" width="48" height="36" rx="3" ry="3"
        fill="#1a2a3a" stroke="#4488cc" stroke-width="2" opacity="0.85"/>
  <!-- Grid lines -->
  <g stroke="#2255aa" stroke-width="0.8" opacity="0.6">
    <line x1="8" y1="32" x2="56" y2="32"/>
    <line x1="8" y1="44" x2="56" y2="44"/>
    <line x1="20" y1="20" x2="20" y2="56"/>
    <line x1="32" y1="20" x2="32" y2="56"/>
    <line x1="44" y1="20" x2="44" y2="56"/>
  </g>
  <!-- Sketch polyline -->
  <polyline points="14,50 24,38 32,44 44,26 54,30"
            fill="none" stroke="#44dd88" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Control points -->
  <circle cx="14" cy="50" r="2.5" fill="#ffcc22"/>
  <circle cx="24" cy="38" r="2.5" fill="#ffcc22"/>
  <circle cx="32" cy="44" r="2.5" fill="#ffcc22"/>
  <circle cx="44" cy="26" r="2.5" fill="#ffcc22"/>
  <circle cx="54" cy="30" r="2.5" fill="#ffcc22"/>
  <!-- Pencil icon top-left -->
  <g transform="translate(8,4) rotate(35,10,10)">
    <rect x="7" y="2" width="5" height="14" rx="1" fill="#ddbb44"/>
    <polygon points="7,16 12,16 9.5,21" fill="#eeeeee"/>
    <rect x="7" y="2" width="5" height="4" rx="1" fill="#cc6633"/>
  </g>
</svg>
