<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="cylSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#285880"/>
      <stop offset="40%"  style="stop-color:#5090C0"/>
      <stop offset="100%" style="stop-color:#285880"/>
    </linearGradient>
    <linearGradient id="cylTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D8F8"/>
      <stop offset="100%" style="stop-color:#5090C0"/>
    </linearGradient>
  </defs>
  <!-- Side surface (rectangle between two ellipses) -->
  <path d="M4,8 L4,18 A8,3 0 0 0 20,18 L20,8 A8,3 0 0 1 4,8 Z" fill="url(#cylSide)" stroke="#1A4070" stroke-width="0.7"/>
  <!-- Bottom ellipse (partially visible) -->
  <ellipse cx="12" cy="18" rx="8" ry="3" fill="#285880" stroke="#1A4070" stroke-width="0.7"/>
  <!-- Top ellipse -->
  <ellipse cx="12" cy="8" rx="8" ry="3" fill="url(#cylTop)" stroke="#1A4070" stroke-width="0.7"/>
  <!-- Left / right vertical edges -->
  <line x1="4"  y1="8" x2="4"  y2="18" stroke="#1A4070" stroke-width="0.7"/>
  <line x1="20" y1="8" x2="20" y2="18" stroke="#1A4070" stroke-width="0.7"/>
</svg>
