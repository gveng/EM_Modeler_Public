<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="sphGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   style="stop-color:#B8E0F8"/>
      <stop offset="60%"  style="stop-color:#4888C0"/>
      <stop offset="100%" style="stop-color:#184878"/>
    </radialGradient>
  </defs>
  <!-- Main sphere -->
  <circle cx="12" cy="12" r="10" fill="url(#sphGrad)" stroke="#1A4070" stroke-width="0.7"/>
  <!-- Equatorial ellipse -->
  <ellipse cx="12" cy="12" rx="10" ry="3.5" fill="none" stroke="#1A4070" stroke-width="0.55" opacity="0.7"/>
  <!-- Meridional ellipse -->
  <ellipse cx="12" cy="12" rx="3.5" ry="10" fill="none" stroke="#1A4070" stroke-width="0.55" opacity="0.7"/>
  <!-- Specular highlight -->
  <ellipse cx="9" cy="7" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.30" transform="rotate(-20 9 7)"/>
</svg>
